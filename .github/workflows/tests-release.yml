name: Tests (full matrix)

# Full PHP version sweep across all DB engines. Triggered on tag
# pushes (so every release gets validated) and on-demand via
# workflow_dispatch — run this manually before cutting a release if
# main has accumulated significant changes since the last tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
    with:
      EXTNAME: 'avathar/bbaccounts'
      PRIMARY_PHP_VERSION: '8.1'
      PHP_VERSION_MATRIX: '["8.1", "8.2", "8.3", "8.4"]'
      RUN_MSSQL_JOBS: 0
